#razorpayMerchantJourney .mj-auth{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(320px,1fr);background:#fff;min-height:610px;color:#161b24}
#razorpayMerchantJourney .mj-auth-brand{padding:35px 35px 38px;display:flex;flex-direction:column;justify-content:space-between;border-right:1px solid #f0f1f4;background:linear-gradient(145deg,#fff 70%,#f8fbff)}
#razorpayMerchantJourney .mj-auth-logo{width:132px;height:auto;display:block}
#razorpayMerchantJourney .mj-brand-line{font-size:26px;line-height:1.3;font-weight:650;max-width:390px;color:#205b54;margin-bottom:17px}
#razorpayMerchantJourney .mj-auth-points{display:flex;flex-wrap:wrap;gap:17px;font-size:12px;color:#386b62}
#razorpayMerchantJourney .mj-auth-form{padding:44px 38px 30px;display:flex;flex-direction:column;gap:17px}
#razorpayMerchantJourney .mj-auth-icon{height:42px;width:42px;display:block;margin-bottom:6px}
#razorpayMerchantJourney .mj-auth-form h2{font-size:24px;line-height:1.45;margin:0;max-width:380px}
#razorpayMerchantJourney .mj-auth-form .as-button{width:100%;min-height:39px;border-radius:6px}
#razorpayMerchantJourney .mj-auth-form .as-primary{background:linear-gradient(95deg,#4668ff,#315aff);border-color:#315aff}
#razorpayMerchantJourney .mj-auth-bottom{margin-top:auto;padding-top:45px;font-size:11px;color:#616977}
#razorpayMerchantJourney .mj-auth-label{display:block;margin:5px 0 7px;font-size:12px;color:#4d5969}
#razorpayMerchantJourney .mj-or{display:flex;gap:12px;align-items:center;color:#89909b;font-size:11px;margin:2px 0}
#razorpayMerchantJourney .mj-or:before,#razorpayMerchantJourney .mj-or:after{content:&#x27;&#x27;;height:1px;background:#e5e7eb;flex:1}
#razorpayMerchantJourney .mj-preview-label{font-size:11px;color:#616d7a;background:#f3f6fa;padding:8px 10px;border-radius:5px;margin-bottom:13px}
#razorpayMerchantJourney .mj-sidebar-button{background:transparent;border:0;text-align:left;width:100%;color:var(--as-ink)}
#razorpayMerchantJourney .mj-dash-head{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:23px}
#razorpayMerchantJourney .mj-dash-head h2{margin:0;font-size:23px}
#razorpayMerchantJourney .mj-box{border:1px solid var(--as-line);border-radius:8px;background:#fff;padding:17px;min-width:0}
#razorpayMerchantJourney .mj-payments-summary{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:22px}
#razorpayMerchantJourney .mj-payments-summary strong{display:block;font-size:27px;margin-top:8px;font-weight:600}
#razorpayMerchantJourney .mj-empty{padding:35px 20px;text-align:center;color:var(--as-muted);background:#fff;border:1px solid var(--as-line);border-radius:8px}
#razorpayMerchantJourney .mj-dashboard-tabs{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}
#razorpayMerchantJourney .mj-dashboard-tab{border:1px solid var(--as-line);border-radius:5px;padding:6px 10px;background:#fff;color:#4d5867;min-height:32px;font-size:12px}
#razorpayMerchantJourney .mj-dashboard-tab[aria-selected=true]{border-color:#80a8ee;color:#234fba;background:#edf3ff}
#razorpayMerchantJourney .mj-attention{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:13px;padding:14px;border:1px solid #e7d9be;background:#fffaf0;border-radius:7px;margin-bottom:18px}
#razorpayMerchantJourney .mj-attention strong{font-size:13px}
#razorpayMerchantJourney .mj-attention small{font-size:11px;color:#745c38;display:block;margin-top:4px}
#razorpayMerchantJourney .mj-metric-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:19px}
#razorpayMerchantJourney .mj-metric{background:#fff;border:1px solid var(--as-line);border-radius:8px;padding:14px;min-width:0}
#razorpayMerchantJourney .mj-metric-label{font-size:11px;color:#5c6775;display:block}
#razorpayMerchantJourney .mj-metric-value{display:block;font-size:23px;font-weight:600;margin:5px 0}
#razorpayMerchantJourney .mj-metric small{display:block;font-size:11px;color:#68717e}
#razorpayMerchantJourney .mj-two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px}
#razorpayMerchantJourney .mj-status-line{display:flex;gap:12px;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--as-line);font-size:12px}
#razorpayMerchantJourney .mj-status-line:last-child{border:0}
#razorpayMerchantJourney .mj-demo-bar{display:flex;flex-wrap:wrap;gap:11px;align-items:center;justify-content:space-between;padding:10px 12px;background:#edf3ff;border-radius:6px;margin-top:18px;font-size:11px;color:#435775}
#razorpayMerchantJourney .mj-demo-bar .as-button{font-size:11px;padding:5px 9px}
#razorpayMerchantJourney .mj-section-head{display:flex;align-items:flex-start;flex-wrap:wrap;gap:12px;justify-content:space-between;margin-bottom:14px}
#razorpayMerchantJourney .mj-analytics-period{display:block;font-size:11px;color:#687280;margin:4px 0 16px}
#razorpayMerchantJourney .mj-north-star{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start;justify-content:space-between;background:#fff;border:1px solid var(--as-line);border-radius:8px;padding:17px;margin-bottom:14px}
#razorpayMerchantJourney .mj-north-star strong{font-size:13px;display:block}
#razorpayMerchantJourney .mj-north-star-value{font-size:20px;font-weight:600;color:#40516b}
#razorpayMerchantJourney .mj-business-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:17px}
#razorpayMerchantJourney .mj-guardrail{display:grid;grid-template-columns:1fr 1fr 1fr;gap:13px;border-bottom:1px solid var(--as-line);padding:12px 0;font-size:12px}
#razorpayMerchantJourney .mj-guardrail:last-child{border:0}
#razorpayMerchantJourney .mj-guardrail span:nth-child(2){font-weight:600;color:#285f45}
#razorpayMerchantJourney .mj-cost-table{width:100%;border-collapse:collapse;font-size:12px}
#razorpayMerchantJourney .mj-cost-table td{padding:7px 0;border-bottom:1px solid #eceef1}
#razorpayMerchantJourney .mj-cost-table td:last-child{text-align:right;font-variant-numeric:tabular-nums}
#razorpayMerchantJourney .mj-cost-table tr:last-child td{font-weight:650;border-bottom:0;padding-top:11px}
#razorpayMerchantJourney .mj-learning-row{padding:11px 0;border-bottom:1px solid var(--as-line);font-size:12px}
#razorpayMerchantJourney .mj-learning-row:last-child{border:0}
#razorpayMerchantJourney .mj-learning-row small{display:block;margin-top:4px;color:var(--as-muted);font-size:11px}
#razorpayMerchantJourney .mj-inline-policy{display:grid;gap:8px;margin-top:11px;font-size:12px}
#razorpayMerchantJourney .mj-intent-label{font-size:11px;background:#f1f4f8;color:#506174;display:inline-block;padding:3px 7px;border-radius:4px;margin:10px 0}
#razorpayMerchantJourney .mj-chat{margin:14px 0;display:grid;gap:9px;font-size:12px}
#razorpayMerchantJourney .mj-chat-bubble{padding:10px 11px;background:#f1f2f4;border-radius:7px;max-width:96%}
#razorpayMerchantJourney .mj-chat-bubble.customer{background:#edf3ff;margin-left:auto}
#razorpayMerchantJourney .mj-chat-bubble small{display:block;font-size:10px;color:#697581;margin-bottom:4px}
#razorpayMerchantJourney .mj-drawer-tabs{display:flex;gap:14px;margin:13px 0 15px;border-bottom:1px solid var(--as-line)}
#razorpayMerchantJourney .mj-drawer-tab{border:0;background:none;border-bottom:2px solid transparent;padding:7px 0;color:#65717d;font-size:12px}
#razorpayMerchantJourney .mj-drawer-tab[aria-selected=true]{color:#2453b6;border-color:#2453b6}
#razorpayMerchantJourney .mj-attention-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
#razorpayMerchantJourney .mj-login-actions{display:grid;gap:12px}
#razorpayMerchantJourney .mj-error{color:#a03939;font-size:12px;margin-top:7px}
#razorpayMerchantJourney .mj-mode-tag{font-size:10px;background:#edf3ff;color:#2b527f;border-radius:4px;padding:3px 6px}
#razorpayMerchantJourney .as-catalog .as-agent-card:last-child{grid-column:auto}
@media(max-width:760px){#razorpayMerchantJourney .mj-auth{grid-template-columns:1fr;min-height:0}#razorpayMerchantJourney .mj-auth-brand{padding:25px;border-right:0;border-bottom:1px solid #edf0f3}#razorpayMerchantJourney .mj-auth-brand .mj-brand-copy{display:none}#razorpayMerchantJourney .mj-auth-form{padding:28px 25px}#razorpayMerchantJourney .mj-auth-bottom{padding-top:20px}#razorpayMerchantJourney .mj-two-col{grid-template-columns:1fr}#razorpayMerchantJourney .mj-metric-grid,#razorpayMerchantJourney .mj-business-grid{grid-template-columns:1fr 1fr}#razorpayMerchantJourney .mj-payments-summary{gap:12px}}
@media(max-width:440px){#razorpayMerchantJourney .mj-metric-grid,#razorpayMerchantJourney .mj-business-grid{grid-template-columns:1fr}#razorpayMerchantJourney .mj-auth-form{padding:23px 19px}#razorpayMerchantJourney .mj-auth-form h2{font-size:22px}#razorpayMerchantJourney .mj-auth-form .as-input{font-size:15px}#razorpayMerchantJourney .mj-dashboard-tab,#razorpayMerchantJourney .mj-drawer-tab{min-height:44px}#razorpayMerchantJourney .mj-guardrail{grid-template-columns:1.25fr 1fr;gap:8px}#razorpayMerchantJourney .mj-guardrail span:last-child{grid-column:1/-1;color:var(--as-muted);font-size:11px}}
&lt;/style&gt;
